      examples: [{ elapsedS: 1500, nextItemIndex: 1 }]
    TimeCheckOption:
      type: object
      additionalProperties: false
      required: [items, projectedS]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
