    # ---------- finish (UF-03.3) ----------
    SessionSummary:
      description: >-
        Response of POST /sessions/{id}/finish. `withinBudget = durationS ≤ timeBudgetMin × 60 +
        120`.
      type: object
      additionalProperties: false
      required: [sessionId, startedAt, endedAt, durationS, timeBudgetMin, withinBudget, exerciseCount, hardSets, weightedSetsByArea, balance]
      properties:
        sessionId: { type: string, format: uuid }
        startedAt: { $ref: "#/components/schemas/Instant" }
        endedAt: { $ref: "#/components/schemas/Instant" }
        durationS: { type: integer, minimum: 0 }
        timeBudgetMin: { type: integer, minimum: 1, maximum: 480 }
        withinBudget: { type: boolean }
        exerciseCount: { type: integer, minimum: 0 }
        hardSets: { type: integer, minimum: 0 }
        weightedSetsByArea: { $ref: "#/components/schemas/AreaSetCounts" }
        balance: { $ref: "#/components/schemas/BalanceResult" }
      examples:
        - sessionId: 0b9c4a52-6f1e-4d7a-9a51-2c3d4e5f6a7b
          startedAt: "2026-09-27T10:00:00+02:00"
          endedAt: "2026-09-27T11:35:00+02:00"
          durationS: 5700
          timeBudgetMin: 45
          withinBudget: false
          exerciseCount: 3
          hardSets: 9
          weightedSetsByArea: { chest: 4, back: 3, shoulders: 0, arms: 0, core: 0, glutes: 0, quads: 2, hamstrings: 0, calves: 0 }
          balance: *zeroBalance

    # ---------- engine inputs (D-0034 §1, D-0037 §6) ----------
    HistorySet:
      description: One logged set as the engine sees it (rule 0). `pending` marks a queued offline set.
      x-engine-function: balance, suggest, prefill
      type: object
      additionalProperties: false
      required: [clientId, sessionId, exerciseId, isWarmup, completedAt, editedAt, deletedAt, reps, weightKg, durationS]
      properties:
        clientId: { type: string, minLength: 1 }
        sessionId: { type: string, minLength: 1 }
        exerciseId: { $ref: "#/components/schemas/ExerciseId" }
        isWarmup: { type: boolean }
        completedAt: { $ref: "#/components/schemas/Instant" }
        editedAt: { $ref: "#/components/schemas/Instant" }
        deletedAt:
          anyOf: [{ $ref: "#/components/schemas/Instant" }, { type: "null" }]
        pending: { type: boolean }
        reps: { type: [integer, "null"], minimum: 0 }
        weightKg: { type: [number, "null"], minimum: 0 }
        durationS: { type: [integer, "null"], minimum: 0 }
      examples:
        - { clientId: C1, sessionId: S1, exerciseId: back-squat, isWarmup: false, completedAt: "2026-09-20T10:00:00Z", editedAt: "2026-09-20T10:05:00Z", deletedAt: null, reps: 8, weightKg: 60, durationS: null }
    LibraryExercise:
      description: A library entry as the engine sees it (D-0034 §1 superset, D-0037 §6).
      x-engine-function: balance, suggest, rankSwaps, prefill
      type: object
      additionalProperties: false
      required: [id, name, kind, type, level, equipment, areas, timed, incrementKg, defaultDurationS, externalLoad]
      properties:
        id: { $ref: "#/components/schemas/ExerciseId" }
        name: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/ExerciseKind" }
        type: { $ref: "#/components/schemas/ExerciseType" }
        level: { $ref: "#/components/schemas/Level" }
        equipment:
          type: array
          items: { type: string, minLength: 1 }
        areas: { $ref: "#/components/schemas/AreaWeights" }
        timed: { type: boolean }
        incrementKg: { type: number, exclusiveMinimum: 0 }
        defaultDurationS: { type: [integer, "null"], minimum: 1 }
        externalLoad: { type: boolean }
      examples:
        - { id: back-squat, name: Back squat, kind: exercise, type: compound, level: beginner, equipment: [barbell, rack], areas: { quads: 1, hamstrings: 0.5 }, timed: false, incrementKg: 2.5, defaultDurationS: null, externalLoad: true }
    AreaTarget:
      x-engine-function: balance, suggest
      type: object
      additionalProperties: false
      required: [area, setsPer14d, source, updatedAt]
      properties:
        area: { $ref: "#/components/schemas/Area" }
        setsPer14d: { type: integer, minimum: 1 }
        source: { $ref: "#/components/schemas/TargetSource" }
        updatedAt: { $ref: "#/components/schemas/Instant" }
      examples: [{ area: chest, setsPer14d: 20, source: default, updatedAt: "2026-08-02T09:00:00Z" }]
    EngineProfile:
      x-engine-function: suggest, evaluateCheckin
      type: object
      additionalProperties: false
      required: [goal, level, equipment, rhythmMin, rhythmMax, priorityAreas, onboardedAt, planUpdatedAt]
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        level: { $ref: "#/components/schemas/Level" }
        equipment:
          type: array
          items: { type: string, minLength: 1 }
        rhythmMin: { type: integer, minimum: 1, maximum: 7 }
        rhythmMax: { type: integer, minimum: 1, maximum: 7 }
        priorityAreas:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/Area" }
        onboardedAt: { $ref: "#/components/schemas/Instant" }
        planUpdatedAt: { $ref: "#/components/schemas/Instant" }
      examples:
        - { goal: build_muscle, level: beginner, equipment: [barbell, rack, bench, dumbbell, cable, machine, pullup-bar], rhythmMin: 3, rhythmMax: 4, priorityAreas: [], onboardedAt: "2026-08-02T09:00:00Z", planUpdatedAt: "2026-08-02T09:00:00Z" }
    CheckinSession:
      description: A session as rule 9 counts it. Completed = `hardSetCount ≥ 1`.
      x-engine-function: evaluateCheckin
      type: object
      additionalProperties: false
      required: [id, startedAt, hardSetCount]
      properties:
        id: { type: string, minLength: 1 }
        startedAt: { $ref: "#/components/schemas/Instant" }
        hardSetCount: { type: integer, minimum: 0 }
      examples: [{ id: S1, startedAt: "2026-09-20T10:00:00Z", hardSetCount: 9 }]
    PlanCheckin:
      description: A `plan_checkins` row as rule 9 reads it (D-0018, D-0027). `completedPrev` is null for a one-period evaluation (D-0070 §6, D-0094).
      x-engine-function: evaluateCheckin
      type: object
      additionalProperties: false
      required: [id, periodIndex, completedPrev, completedLast, rhythmMinBefore, rhythmMaxBefore, proposedMin, proposedMax, proposedAt, answer, answeredAt]
      properties:
        id: { type: string, minLength: 1 }
        periodIndex: { type: integer, minimum: 0 }
        completedPrev:
          anyOf: [{ type: integer, minimum: 0 }, { type: "null" }]
        completedLast: { type: integer, minimum: 0 }
        rhythmMinBefore: { type: integer, minimum: 1, maximum: 7 }
        rhythmMaxBefore: { type: integer, minimum: 1, maximum: 7 }
        proposedMin: { type: integer, minimum: 1, maximum: 7 }
        proposedMax: { type: integer, minimum: 1, maximum: 7 }
        proposedAt: { $ref: "#/components/schemas/Instant" }
        answer:
          anyOf: [{ type: string, enum: [accepted, kept, withdrawn] }, { type: "null" }]
        answeredAt:
          anyOf: [{ $ref: "#/components/schemas/Instant" }, { type: "null" }]
      examples:
        - { id: P1, periodIndex: 3, completedPrev: 4, completedLast: 3, rhythmMinBefore: 3, rhythmMaxBefore: 4, proposedMin: 2, proposedMax: 3, proposedAt: "2026-09-27T09:00:00Z", answer: null, answeredAt: null }
        - { id: P0, periodIndex: 0, completedPrev: null, completedLast: 0, rhythmMinBefore: 3, rhythmMaxBefore: 4, proposedMin: 2, proposedMax: 3, proposedAt: "2026-10-04T07:00:00Z", answer: null, answeredAt: null }

    # ---------- check-in (rule 9, UF-11) ----------
    CheckinPeriod:
      type: object
      additionalProperties: false
      required: [index, start, end, completed, status]
      properties:
        index: { type: integer, minimum: 0 }
        start: { $ref: "#/components/schemas/LocalDate" }
        end: { $ref: "#/components/schemas/LocalDate" }
        completed: { type: integer, minimum: 0 }
        status: { type: string, enum: [under, on_plan, over] }
      examples:
        - { index: 2, start: "2026-08-30", end: "2026-09-12", completed: 4, status: under }
        - { index: 0, start: "2026-09-20", end: "2026-10-03", completed: 0, status: under }
    PreviewTarget:
      type: object
      additionalProperties: false
      required: [area, setsPer14d]
      properties:
        area: { $ref: "#/components/schemas/Area" }
        setsPer14d: { type: integer, minimum: 1 }
      examples: [{ area: chest, setsPer14d: 14 }]
    CheckinProposal:
      type: object
      additionalProperties: false
      required: [direction, rhythmMin, rhythmMax, previewTargets]
      properties:
        direction: { type: string, enum: [down, up] }
        rhythmMin: { type: integer, minimum: 1, maximum: 7 }
        rhythmMax: { type: integer, minimum: 1, maximum: 7 }
        previewTargets:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: "#/components/schemas/PreviewTarget" }
      examples:
        - direction: down
          rhythmMin: 2
          rhythmMax: 3
          previewTargets:
            - { area: chest, setsPer14d: 14 }
            - { area: back, setsPer14d: 14 }
            - { area: shoulders, setsPer14d: 11 }
            - { area: arms, setsPer14d: 9 }
            - { area: core, setsPer14d: 9 }
            - { area: glutes, setsPer14d: 14 }
            - { area: quads, setsPer14d: 14 }
            - { area: hamstrings, setsPer14d: 11 }
            - { area: calves, setsPer14d: 9 }
    CheckinEvaluation:
      description: Rule 9 `evaluateCheckin` output (UF-11.1). Computed on the device.
      x-engine-function: evaluateCheckin
      type: object
      additionalProperties: false
      required: [periods, proposal, nextCheckinDate]
      properties:
        periods:
          type: array
          items: { $ref: "#/components/schemas/CheckinPeriod" }
        proposal:
          anyOf: [{ $ref: "#/components/schemas/CheckinProposal" }, { type: "null" }]
        nextCheckinDate: { $ref: "#/components/schemas/LocalDate" }
      examples:
        - { periods: [], proposal: null, nextCheckinDate: "2026-10-04" }

    # ---------- swaps (rule 12, UF-08.3, UF-05.1) ----------
    SwapCandidate:
      x-engine-function: rankSwaps
      type: object
      additionalProperties: false
      required: [exerciseId, muscleMatch, timeCostS, equipment, fitsBudget, bestMatch]
      properties:
        exerciseId: { $ref: "#/components/schemas/ExerciseId" }
        muscleMatch: { type: number, minimum: 0, maximum: 1 }
        timeCostS: { type: integer, minimum: 0 }
        equipment:
          type: array
          items: { type: string, minLength: 1 }
        fitsBudget: { type: boolean }
        bestMatch: { type: boolean }
      examples: [{ exerciseId: db-row, muscleMatch: 0.667, timeCostS: 555, equipment: [dumbbell, bench], fitsBudget: true, bestMatch: true }]
    SwapCandidateList:
      description: Rule 12 `rankSwaps` output, best first.
      x-engine-function: rankSwaps
      type: array
      items: { $ref: "#/components/schemas/SwapCandidate" }
      examples:
        - - { exerciseId: db-row, muscleMatch: 0.667, timeCostS: 555, equipment: [dumbbell, bench], fitsBudget: true, bestMatch: true }
          - { exerciseId: straight-arm-pulldown, muscleMatch: 0.667, timeCostS: 375, equipment: [cable], fitsBudget: true, bestMatch: false }

    # ---------- time check (rule 8, UF-09.8) ----------
    TimeCheckProgress:
      x-engine-function: timeCheck
      type: object
      additionalProperties: false
      required: [elapsedS, nextItemIndex]
      properties:
