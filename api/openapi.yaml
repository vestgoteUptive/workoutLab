        minutesBehind: { type: [integer, "null"], minimum: 1 }
        projectedS: { type: integer, minimum: 0 }
        trim: { $ref: "#/components/schemas/TimeCheckOption" }
        skipNext: { $ref: "#/components/schemas/TimeCheckOption" }
      examples:
        - { behindS: 59, show: false, minutesBehind: null, projectedS: 2759, trim: { items: [], projectedS: 2759 }, skipNext: { items: [], projectedS: 2204 } }
