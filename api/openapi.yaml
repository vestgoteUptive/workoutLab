      examples: [{ items: [], projectedS: 2700 }]
    TimeCheckResult:
      description: Rule 8 `timeCheck` output. `minutesBehind` is null when `show` is false.
      x-engine-function: timeCheck
      type: object
      additionalProperties: false
      required: [behindS, show, minutesBehind, projectedS, trim, skipNext]
