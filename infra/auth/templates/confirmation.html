<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Confirm your workoutLab account</title>
</head>
<body bgcolor="#121210" style="margin: 0; padding: 0; background-color: #121210; color: #F2EFE8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#121210" style="background-color: #121210;">
<tr>
<td align="center" style="padding: 32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 480px;">
<tr>
<td style="padding: 0 0 24px 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 32px; font-weight: 800; line-height: 1.1; color: #D4F25A;"><font color="#D4F25A">workoutLab</font></td>
</tr>
<tr>
<td style="padding: 0 0 24px 0; font-family: 'DM Sans', Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #F2EFE8;"><font color="#F2EFE8">Tap the button to confirm your email and sign in to workoutLab.</font></td>
</tr>
<tr>
<td style="padding: 0 0 32px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td bgcolor="#D4F25A" style="background-color: #D4F25A; border-radius: 8px;"><a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 14px 28px; font-family: 'DM Sans', Arial, sans-serif; font-size: 16px; font-weight: 700; color: #121210; text-decoration: none; border-radius: 8px;"><font color="#121210">Confirm and sign in</font></a></td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding: 0 0 8px 0; font-family: 'DM Sans', Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #A8A398;"><font color="#A8A398">Or type this 6-digit code in the app instead:</font></td>
</tr>
<tr>
<td style="padding: 0 0 32px 0; font-family: 'DM Sans', Arial, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #F2EFE8;"><font color="#F2EFE8">{{ .Token }}</font></td>
</tr>
<tr>
<td style="font-family: 'DM Sans', Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #A8A398;"><font color="#A8A398">Didn't ask for this? Ignore this mail.</font></td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
