name: deploy

# T-0402a (D-0184 §5, D-0186 §1). Only CI deploys; agents never run wrangler.
# - preview: every pushed non-main branch, behind the repo variable PREVIEWS_ENABLED.
#   Previews point at the prod Supabase project (no staging, D-0184 §5), see infra/deploy/README.md.
# - production: follows a green `CI` run on main, behind PROD_DEPLOY_ENABLED. That variable stays
#   unset until the first prod deploy at gate H-06 (T-0402d).

on:
  push:
    branches-ignore: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# M2 (T-0543): only previews (push) may be cancelled; a workflow_run (release + deploy) never is.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.147.0"
  # T-0543: tools for the release job. The Postgres client major matches prod (supabase/config.toml
  # major_version = 17); the age binary is checked against a pinned sha256.
  PG_CLIENT_MAJOR: "17"
  AGE_VERSION: "1.2.1"
  AGE_SHA256: "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"

jobs:
  preview:
    name: preview (branch deploy)
    if: github.event_name == 'push' && vars.PREVIEWS_ENABLED == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tokens.css is generated and gitignored; build it first, as deploy-prod.sh does (T-0907).
      - name: Build design tokens
        run: pnpm --filter @workoutlab/design-tokens build
      - name: Build web
        run: pnpm --filter @workoutlab/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy web preview
        id: web
        run: |
          set -euo pipefail
          npx -y wrangler@${WRANGLER_VERSION} pages deploy apps/web/dist --project-name workoutlab-web --branch "$BRANCH" 2>&1 | tee web-deploy.log
          # Pages lower-cases, rewrites and truncates the branch, so read the alias from the output.
          alias_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workoutlab-web\.pages\.dev' web-deploy.log | tail -n 1)"
          if [ -z "$alias_url" ]; then echo "no alias URL found in wrangler output" >&2; exit 1; fi
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build landing (CTA points at this branch's app)
        run: pnpm --filter @workoutlab/landing build
        env:
          PUBLIC_APP_URL: ${{ steps.web.outputs.alias_url }}
      - name: Deploy landing preview
        id: landing
        run: |
          set -euo pipefail
          npx -y wrangler@${WRANGLER_VERSION} pages deploy apps/landing/dist --project-name workoutlab-landing --branch "$BRANCH" 2>&1 | tee landing-deploy.log
          alias_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workoutlab-landing\.pages\.dev' landing-deploy.log | tail -n 1)"
          if [ -z "$alias_url" ]; then echo "no alias URL found in wrangler output" >&2; exit 1; fi
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summary
        run: |
          {
            echo "### Preview deployed"
            echo "- web: ${{ steps.web.outputs.alias_url }}"
            echo "- landing: ${{ steps.landing.outputs.alias_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: production (main, off until H-06)
    # T-0543 (D-0201): the database and the functions are released before the app that uses them.
    needs: release
    # `branches: [main]` above matches the triggering run's head branch NAME, which a fork PR can
    # also call `main`. Only deploy a push to this repository's own main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tokens.css is generated and gitignored; build it first, as deploy-prod.sh does (T-0907).
      - name: Build design tokens
        run: pnpm --filter @workoutlab/design-tokens build
      - name: Build web
        run: pnpm --filter @workoutlab/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # PUBLIC_APP_URL stays unset: the landing CTA defaults to the prod app (T-0309).
      - name: Build landing
        run: pnpm --filter @workoutlab/landing build
      - name: Deploy web and landing to production
        run: |
          set -euo pipefail
          npx -y wrangler@${WRANGLER_VERSION} pages deploy apps/web/dist --project-name workoutlab-web --branch main
          npx -y wrangler@${WRANGLER_VERSION} pages deploy apps/landing/dist --project-name workoutlab-landing --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # T-0543 (D-0201). Listed after `production` on purpose; `production` needs it. Same guard
  # conditions as `production`. Order: guard -> backup -> upload -> plan -> apply. Any failing step
  # stops the job and so the deploy. The ref comes from vars; the only secrets are the two below,
  # and only on the guard, backup and release steps (check-deploy-workflow.mjs enforces it).
  release:
    name: release (prod Supabase, before the deploy)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # M5: both secrets live in this GitHub Environment (main only, no reviewers), not in repo secrets.
    environment: production
    concurrency:
      group: prod-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # L1: never release a SHA that is not the current tip of main (re-runs, a `main` tag).
      - name: Require head_sha is the tip of main
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "head_sha $HEAD_SHA is not the tip of main ($tip); not releasing" >&2
            exit 1
          fi
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install postgres client and age (pinned)
        run: |
          set -euo pipefail
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_CLIENT_MAJOR}"
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP/age-bin" --strip-components=1
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin/pg_dump" --version
          echo "/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin" >> "$GITHUB_PATH"
      # L3: fetch the pinned CLI into the npx cache before any secret is in an environment.
      - name: Prefetch supabase CLI (no secrets)
        run: |
          set -euo pipefail
          v="$(sed -n 's/^CLI_VERSION="\(.*\)"/\1/p' infra/scripts/supabase-prod-release.sh)"
          npx -y "supabase@$v" --version
      - name: Destructive-migration guard
        run: |
          set -euo pipefail
          bash infra/scripts/supabase-prod-release.sh plan | tee "$RUNNER_TEMP/release-plan.txt"
          node infra/scripts/migration-guard.mjs --plan "$RUNNER_TEMP/release-plan.txt"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      - name: Encrypted backup
        run: bash infra/scripts/prod-backup.sh "$RUNNER_TEMP/backup" "$GITHUB_SHA_RELEASED"
        env:
          GITHUB_SHA_RELEASED: ${{ github.event.workflow_run.head_sha }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      - name: Upload encrypted backup (7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-backup-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/backup/*.sql.age
          retention-days: 7
          if-no-files-found: error
      - name: Release plan
        run: bash infra/scripts/supabase-prod-release.sh plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      - name: Release apply
        run: bash infra/scripts/supabase-prod-release.sh apply
        env:
          CONFIRM_PROD_RELEASE: ${{ vars.SUPABASE_PROD_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
