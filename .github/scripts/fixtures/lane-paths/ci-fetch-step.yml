name: CI
on:
  pull_request:
jobs:
  checks:
    name: typecheck / lint / unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the diff base
        run: git fetch --no-tags --depth=0 origin main
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
