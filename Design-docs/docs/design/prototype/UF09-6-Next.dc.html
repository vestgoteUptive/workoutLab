class Component extends DCLogic {
constructor(p) { super(p); this.state = { left: 60 }; }
componentDidMount() { this.t = setInterval(() => { if (this.state.left > 0) this.setState({ left: this.state.left - 1 }); }, 1000); }
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
const l = this.state.left;
return { clock: l > 0 ? Math.floor(l / 60) + ':' + String(l % 60).padStart(2, '0') : 'Ready?', offset: String(113 * (1 - l / 60)) };
}
}
