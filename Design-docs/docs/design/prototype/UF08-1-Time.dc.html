<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-08.1 Time and energy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A8A398}
.card{background:#1D1C19;border:1px solid #2E2C28;border-radius:16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:#D4F25A;color:#121210;font:700 17px 'DM Sans',sans-serif;text-decoration:none}
.btn:hover{color:#121210;background:#E6FA95}
.step{width:56px;height:56px;border-radius:16px;border:1px solid #3A3833;background:#1D1C19;color:#F2EFE8;font:700 26px 'DM Sans',sans-serif;cursor:pointer}
.chip{flex:1;min-height:44px;border-radius:12px;border:1px solid #3A3833;background:transparent;color:#F2EFE8;font:500 15px 'DM Sans',sans-serif;cursor:pointer}
.chip.on{background:#D4F25A;color:#121210;border-color:#D4F25A;font-weight:700}
.en{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid #3A3833;background:transparent;color:#F2EFE8;font:500 14px 'DM Sans',sans-serif;cursor:pointer}
.en.on{border:2px solid #D4F25A;padding:11px 3px;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 32px; display: flex; flex-direction: column; gap: 20px; background: #121210; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="UF02-1-Today.dc.html" aria-label="Close" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #F2EFE8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span class="tag">Step 1 of 3 · Set up</span>
<span style="width: 44px"></span>
</div>
<h1 class="d" style="margin: 0; font-size: 40px; font-weight: 800; text-transform: uppercase; line-height: 1">How much time do you have?</h1>
<div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button class="step" onClick="{{minus}}" aria-label="5 minutes less">−</button>
<div style="text-align: center"><div class="d" style="font-size: 72px; font-weight: 800; line-height: .9">{{mins}}</div><div class="m" style="font-size: 14px">minutes · done by {{doneBy}}</div></div>
<button class="step" onClick="{{plus}}" aria-label="5 minutes more">+</button>
</div>
<div style="display: flex; gap: 6px"><sc-for list="{{quick}}" as="q" hint-placeholder-count="5"><button class="{{q.cls}}" onClick="{{q.pick}}">{{q.t}}</button></sc-for></div>
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 15px">Include 5-min warm-up in this time<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #D4F25A"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="tag">How's your energy?</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{energy}}" as="e" hint-placeholder-count="3">
<button class="{{e.cls}}" onClick="{{e.pick}}">
<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect x="1" y="12" width="7" height="8" rx="2" fill="{{e.c1}}"></rect><rect x="11" y="6" width="7" height="14" rx="2" fill="{{e.c2}}"></rect><rect x="21" y="0" width="7" height="20" rx="2" fill="{{e.c3}}"></rect></svg>
{{e.t}}
</button>
</sc-for>
</div>
<div class="m" style="font-size: 13px">{{energyHint}}</div>
</div>
<div class="card" style="padding: 14px; display: flex; gap: 12px; align-items: center">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#D4F25A" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<div><div style="font-weight: 700">{{fitTitle}}</div><div class="m" style="font-size: 13px">{{fitSub}}</div></div>
</div>
<a class="btn" href="UF08-2-Suggest.dc.html" style="margin-top: auto">Suggest my workout</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { mins: 45, energy: 'normal' }; }
renderVals() {
const m = this.state.mins;
const set = (v) => this.setState({ mins: Math.max(15, Math.min(120, v)) });
const start = 17 * 60 + 30 + m;
const doneBy = Math.floor(start / 60) + ':' + String(start % 60).padStart(2, '0');
const fit = m <= 20 ? [3, 8] : m <= 30 ? [3, 8] : m <= 45 ? [5, 15] : m <= 60 ? [6, 19] : [7, 23];
const lvl = { low: 1, normal: 2, high: 3 };
const hints = { low: 'Fewer sets, same weights. Protects the main lift, trims accessories.', normal: 'Your plan as written.', high: 'Adds a back-off set to the main lift if time allows.' };
return {
mins: String(m), doneBy,
minus: () => set(m - 5), plus: () => set(m + 5),
quick: [20, 30, 45, 60, 90].map((n) => ({ t: String(n), cls: m === n ? 'chip on' : 'chip', pick: () => set(n) })),
energy: [{ id: 'low', t: 'Low' }, { id: 'normal', t: 'Normal' }, { id: 'high', t: 'High' }].map((e) => {
const on = this.state.energy === e.id, L = lvl[e.id], hi = '#D4F25A', lo = '#3A3833';
return { ...e, cls: on ? 'en on' : 'en', c1: hi, c2: L >= 2 ? hi : lo, c3: L >= 3 ? hi : lo, pick: () => this.setState({ energy: e.id }) };
}),
energyHint: hints[this.state.energy],
fitTitle: 'Lower A fits: ' + fit[0] + ' exercises, ' + fit[1] + ' sets',
fitSub: m < 45 ? 'We keep Back Squat and trim accessories.' : m > 45 ? 'We add extra work for glutes, below weekly target.' : 'The full planned session.'
};
}
}
</script>
</body>
</html>
