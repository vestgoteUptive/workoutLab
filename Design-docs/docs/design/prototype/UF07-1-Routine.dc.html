<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-07.1 Edit routine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A8A398}
.card{background:#1D1C19;border:1px solid #2E2C28;border-radius:16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#D4F25A;color:#121210;font:700 16px 'DM Sans',sans-serif;text-decoration:none}
.btn:hover{color:#121210;background:#E6FA95}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#1D1C19;border:1px solid #2E2C28}
.it.new{border:2px solid #D4F25A;padding:9px 11px}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#A8A398;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 32px; display: flex; flex-direction: column; gap: 14px; background: #121210; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="UF02-2-Preview.dc.html" style="font-size: 15px; text-decoration: none; color: #F2EFE8; padding: 12px 4px">Cancel</a>
<span class="tag">Edit routine</span>
<a href="UF02-2-Preview.dc.html" style="font-size: 15px; font-weight: 700; text-decoration: none; padding: 12px 4px">Save</a>
</div>
<label style="display: flex; flex-direction: column; gap: 4px"><span class="tag">Name</span><input value="Lower A" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #3A3833; background: #1D1C19; color: #F2EFE8; font: 800 26px 'Big Shoulders Display', Impact, sans-serif; text-transform: uppercase"></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="e" hint-placeholder-count="5">
<div class="{{e.cls}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#A8A398" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<span style="flex-grow: 1"><span style="display: block; font-weight: 700; font-size: 15px">{{e.t}}</span><span class="m" style="font-size: 13px">{{e.s}}</span></span>
<button class="ib" onClick="{{e.remove}}" aria-label="{{e.rmLabel}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>
<a href="UF04-1-Library.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; border: 1px dashed #3A3833; text-decoration: none; font-weight: 700">+ Add exercise</a>
<div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="tag" style="color: #D4F25A">Progression rule</span><span style="font-size: 13px; color: #D4F25A; font-weight: 700">Change</span></div>
<div style="font-weight: 700">Double progression</div>
<div class="m" style="font-size: 14px; line-height: 1.45">When every set reaches the top of its rep range, add 2.5 kg next time. Two missed sessions in a row trigger a 10% deload.</div>
</div>
<a class="btn" href="UF02-2-Preview.dc.html" style="margin-top: auto">Save routine</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { gone: {} }; }
renderVals() {
const all = [
{ id: 1, t: 'Back Squat', s: '4 × 6–8 · rest 2:30' },
{ id: 2, t: 'Romanian Deadlift', s: '3 × 8–10 · rest 2:00' },
{ id: 3, t: 'Sumo Squat', s: '3 × 10–12 · rest 1:30 · just added', isNew: true },
{ id: 4, t: 'Seated Leg Curl', s: '3 × 10–12 · rest 1:30' },
{ id: 5, t: 'Standing Calf Raise', s: '3 × 12–15 · rest 1:00' }
];
return { items: all.filter((e) => !this.state.gone[e.id]).map((e) => ({ ...e, cls: e.isNew ? 'it new' : 'it', rmLabel: 'Remove ' + e.t, remove: () => this.setState({ gone: { ...this.state.gone, [e.id]: true } }) })) };
}
}
</script>
</body>
</html>
