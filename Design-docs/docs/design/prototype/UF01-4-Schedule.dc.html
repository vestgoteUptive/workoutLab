<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-01.4 Schedule and plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A8A398}
.card{background:#1D1C19;border:1px solid #2E2C28;border-radius:16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#D4F25A;color:#121210;font:700 16px 'DM Sans',sans-serif;text-decoration:none}
.btn:hover{color:#121210;background:#E6FA95}
.day{width:44px;height:44px;border-radius:12px;border:1px solid #3A3833;background:transparent;color:#F2EFE8;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.day.on{background:#D4F25A;color:#121210;border-color:#D4F25A}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #3A3833;background:transparent;color:#F2EFE8;font:500 15px 'DM Sans',sans-serif;cursor:pointer}
.chip.on{background:#D4F25A;color:#121210;border-color:#D4F25A;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 22px; background: #121210; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px">
<a href="UF01-3-Experience.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #F2EFE8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; gap: 6px"><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D4F25A"></div></div>
<span class="m" style="font-size: 13px">3/3</span>
</div>
<h1 class="d" style="margin: 0; font-size: 40px; line-height: 1; font-weight: 800; text-transform: uppercase">When can you train?</h1>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="tag">Training days · {{count}} per week</div>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button class="{{d.cls}}" onClick="{{d.pick}}" aria-label="{{d.full}}">{{d.t}}</button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="tag">Session length</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{lens}}" as="l" hint-placeholder-count="4"><button class="{{l.cls}}" onClick="{{l.pick}}">{{l.t}}</button></sc-for>
</div>
</div>
<div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div class="tag" style="color: #D4F25A">Your plan</div>
<div class="d" style="font-size: 30px; font-weight: 800; text-transform: uppercase; line-height: 1">{{planName}}</div>
<div class="m" style="font-size: 14px">{{planSub}}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{split}}" as="s" hint-placeholder-count="4"><span style="padding: 6px 10px; border-radius: 8px; background: #2A2925; font-size: 13px; font-weight: 500">{{s}}</span></sc-for>
</div>
</div>
<div style="margin-top: auto"><a class="btn" href="UF02-1-Today.dc.html">Build my plan</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { days: { 0: true, 1: true, 3: true, 4: true }, len: 45 }; }
renderVals() {
const names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const count = Object.values(this.state.days).filter(Boolean).length;
const plans = { 1: ['Full Body', ['Full body']], 2: ['Full Body ×2', ['Full A', 'Full B']], 3: ['Full Body ×3', ['Full A', 'Full B', 'Full C']], 4: ['Upper / Lower', ['Upper A', 'Lower A', 'Upper B', 'Lower B']], 5: ['Upper / Lower + Push', ['Upper A', 'Lower A', 'Push', 'Upper B', 'Lower B']], 6: ['Push / Pull / Legs ×2', ['Push', 'Pull', 'Legs', 'Push', 'Pull', 'Legs']], 7: ['Push / Pull / Legs ×2', ['Push', 'Pull', 'Legs', 'Push', 'Pull', 'Legs', 'Rest']] };
const p = plans[count] || ['Pick at least one day', []];
return {
count,
days: 'MTWTFSS'.split('').map((t, i) => ({ t, full: names[i], cls: this.state.days[i] ? 'day on' : 'day', pick: () => this.setState({ days: { ...this.state.days, [i]: !this.state.days[i] } }) })),
lens: [30, 45, 60, 75].map((n) => ({ t: n + ' min', cls: this.state.len === n ? 'chip on' : 'chip', pick: () => this.setState({ len: n }) })),
planName: p[0],
planSub: count ? count + ' days · about ' + this.state.len + ' min · Build muscle · Intermediate' : 'Choose your training days above',
split: p[1]
};
}
}
</script>
</body>
</html>
