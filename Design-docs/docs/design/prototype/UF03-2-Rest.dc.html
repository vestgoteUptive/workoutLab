<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-03.2 Rest timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A8A398}
.card{background:#1D1C19;border:1px solid #2E2C28;border-radius:16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#D4F25A;color:#121210;font:700 16px 'DM Sans',sans-serif;text-decoration:none}
.btn:hover{color:#121210;background:#E6FA95}
.adj{flex:1;min-height:54px;border-radius:14px;border:1px solid #3A3833;background:transparent;color:#F2EFE8;font:700 16px 'DM Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 24px; align-items: stretch; background: #121210; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="UF03-1-Active.dc.html" aria-label="Collapse timer" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #F2EFE8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></a>
<div class="tag">Back Squat · after set 2</div>
<span style="width: 44px"></span>
</div>
<div style="position: relative; width: 280px; height: 280px; align-self: center">
<svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
<circle cx="140" cy="140" r="120" fill="none" stroke="#2A2925" stroke-width="16"></circle>
<circle cx="140" cy="140" r="120" fill="none" stroke="#D4F25A" stroke-width="16" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="{{offset}}" transform="rotate(-90 140 140)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div class="d" style="font-size: 88px; font-weight: 800; line-height: 1">{{clock}}</div>
<div class="m" style="font-size: 15px">of {{total}} rest</div>
</div>
</div>
<div style="display: flex; gap: 10px">
<button class="adj" onClick="{{minus}}">−15 s</button>
<button class="adj" onClick="{{plus}}">+15 s</button>
</div>
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div class="tag" style="color: #D4F25A">Up next · Set 3 of 4</div>
<div class="d" style="font-size: 30px; font-weight: 800">100 kg × 8</div>
<div class="m" style="font-size: 14px">Last time 97.5 kg × 7. Hit 8 reps on all sets and we add 2.5 kg next session.</div>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"></path></svg>
<span class="m">Breathe in and brace before you unrack. Keep the bar over mid-foot.</span>
</div>
<a class="btn" href="UF03-1-Active.dc.html" style="margin-top: auto">Skip rest</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { left: 92, total: 150 }; }
renderVals() {
const f = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const { left, total } = this.state;
return {
clock: f(left), total: f(total),
offset: String(754 * (1 - left / total)),
minus: () => this.setState({ left: Math.max(0, left - 15) }),
plus: () => this.setState({ left: left + 15, total: Math.max(total, left + 15) })
};
}
}
</script>
</body>
</html>
