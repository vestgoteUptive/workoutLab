<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-09.5 Rest countdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0B0B0A}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 12px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#A8A398}
.pz{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#1D1C19;color:#F2EFE8;text-decoration:none}
.adj{flex:1;min-height:56px;border-radius:14px;border:1px solid #3A3833;background:#151513;color:#F2EFE8;font:700 17px 'DM Sans',sans-serif;cursor:pointer}
.go{display:flex;align-items:center;justify-content:center;min-height:64px;border-radius:18px;font:800 24px 'Big Shoulders Display',Impact,sans-serif;text-transform:uppercase;text-decoration:none;letter-spacing:.04em}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: #0B0B0A; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="width: 100%; display: flex; align-items: center; gap: 12px">
<a class="pz" href="UF09-9-Pause.dc.html" aria-label="Pause workout"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></a>
<div style="flex-grow: 1; display: flex; gap: 4px"><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #F2EFE8"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div></div>
<span class="m" style="font-size: 13px; width: 44px; text-align: right">1 / 5</span>
</div>
<div class="tag" style="margin-top: 20px; color: {{labelColor}}">{{label}}</div>
<div style="position: relative; width: 320px; height: 320px">
<svg width="320" height="320" viewBox="0 0 320 320" aria-hidden="true">
<circle cx="160" cy="160" r="140" fill="none" stroke="#1D1C19" stroke-width="16"></circle>
<circle cx="160" cy="160" r="140" fill="none" stroke="{{ringColor}}" stroke-width="16" stroke-linecap="round" stroke-dasharray="880" stroke-dashoffset="{{offset}}" transform="rotate(-90 160 160)"></circle>
</svg>
<div class="d" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 112px; font-weight: 800; color: {{clockColor}}" aria-live="polite">{{clock}}</div>
</div>
<div style="text-align: center">
<div class="tag">Next · set 3 of 4</div>
<div class="d" style="font-size: 40px; font-weight: 800; line-height: 1.1">100 kg × 8</div>
</div>
<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{resting}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 10px">
<button class="adj" onClick="{{minus}}">−15 s</button>
<button class="adj" onClick="{{plus}}">+15 s</button>
<a class="adj" href="UF09-3-Set.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none">Skip</a>
</div>
</sc-if>
<sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
<a class="go" href="UF09-3-Set.dc.html" style="background: #D4F25A; color: #121210">Start set 3</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { left: 150, total: 150 }; }
componentDidMount() { this.t = setInterval(() => { if (this.state.left > 0) this.setState({ left: this.state.left - 1 }); }, 1000); }
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
const { left, total } = this.state;
const f = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const soon = left <= 10 && left > 0;
return {
clock: left > 0 ? f(left) : 'GO',
label: left === 0 ? 'Rest over' : soon ? 'Get into position' : 'Rest',
labelColor: soon || left === 0 ? '#FF8A3D' : '#A8A398',
ringColor: soon ? '#FF8A3D' : '#D4F25A',
clockColor: left === 0 ? '#D4F25A' : '#F2EFE8',
offset: String(880 * (1 - left / total)),
resting: left > 0, over: left === 0,
minus: () => this.setState({ left: Math.max(0, left - 15) }),
plus: () => this.setState({ left: left + 15, total: Math.max(total, left + 15) })
};
}
}
</script>
</body>
</html>
