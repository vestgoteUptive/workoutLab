<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-09.7 Timed set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0B0B0A}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 12px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#A8A398}
.pz{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#1D1C19;color:#F2EFE8;text-decoration:none}
.big{width:88px;height:88px;border-radius:44px;border:0;background:#D4F25A;color:#121210;display:flex;align-items:center;justify-content:center;cursor:pointer}
.go{display:flex;align-items:center;justify-content:center;min-height:64px;border-radius:18px;background:#D4F25A;color:#121210;font:800 24px 'Big Shoulders Display',Impact,sans-serif;text-transform:uppercase;text-decoration:none;letter-spacing:.04em;width:100%}
.go:hover{color:#121210;background:#E6FA95}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: #0B0B0A; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="width: 100%; display: flex; align-items: center; gap: 12px">
<a class="pz" href="UF09-9-Pause.dc.html" aria-label="Pause workout"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></a>
<div style="flex-grow: 1; display: flex; gap: 4px"><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #F2EFE8"></div></div>
<span class="m" style="font-size: 13px; width: 44px; text-align: right">5 / 5</span>
</div>
<div style="text-align: center; margin-top: 12px">
<div class="tag">Timed set · 1 of 3</div>
<div class="d" style="font-size: 52px; font-weight: 800; text-transform: uppercase; line-height: 1">Plank</div>
</div>
<div style="position: relative; width: 300px; height: 300px">
<svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true">
<circle cx="150" cy="150" r="130" fill="none" stroke="#1D1C19" stroke-width="16"></circle>
<circle cx="150" cy="150" r="130" fill="none" stroke="{{ringColor}}" stroke-width="16" stroke-linecap="round" stroke-dasharray="817" stroke-dashoffset="{{offset}}" transform="rotate(-90 150 150)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div class="tag" style="color: {{phaseColor}}">{{phase}}</div>
<div class="d" style="font-size: 104px; font-weight: 800; line-height: 1" aria-live="polite">{{clock}}</div>
</div>
</div>
<div class="m" style="font-size: 16px; text-align: center">{{cue}}</div>
<div style="margin-top: auto; width: 100%; display: flex; justify-content: center">
<sc-if value="{{active}}" hint-placeholder-val="{{ true }}">
<button class="big" onClick="{{toggle}}" aria-label="{{toggleLabel}}">
<sc-if value="{{running}}" hint-placeholder-val="{{ true }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg></sc-if>
</button>
</sc-if>
<sc-if value="{{finished}}" hint-placeholder-val="{{ false }}"><a class="go" href="UF09-5-Rest.dc.html">Rest · then set 2</a></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { phase: 'pre', left: 3, run: true }; }
componentDidMount() {
this.t = setInterval(() => {
const s = this.state;
if (!s.run || s.phase === 'done') return;
if (s.left > 1) this.setState({ left: s.left - 1 });
else if (s.phase === 'pre') this.setState({ phase: 'work', left: 45 });
else this.setState({ phase: 'done', left: 0 });
}, 1000);
}
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
const s = this.state;
const pre = s.phase === 'pre', done = s.phase === 'done';
const total = pre ? 3 : 45;
return {
phase: pre ? 'Get in position' : done ? 'Done' : 'Hold',
phaseColor: pre ? '#FF8A3D' : '#D4F25A',
clock: done ? '✓' : pre ? String(s.left) : '0:' + String(s.left).padStart(2, '0'),
offset: String(done ? 0 : 817 * (1 - s.left / total)),
ringColor: pre ? '#FF8A3D' : '#D4F25A',
cue: pre ? 'Forearms under shoulders, body in one line.' : done ? '45 seconds held. Logged automatically.' : 'Squeeze glutes. Breathe slowly.',
active: !done, finished: done, running: s.run, paused: !s.run,
toggleLabel: s.run ? 'Pause timer' : 'Resume timer',
toggle: () => this.setState({ run: !s.run })
};
}
}
</script>
</body>
</html>
