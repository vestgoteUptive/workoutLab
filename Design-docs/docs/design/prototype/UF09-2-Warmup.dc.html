<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-09.2 Warm-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0B0B0A}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 12px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#A8A398}
.pz{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#1D1C19;color:#F2EFE8;text-decoration:none}
.rb{width:64px;height:64px;border-radius:32px;border:1px solid #3A3833;background:#1D1C19;color:#F2EFE8;display:flex;align-items:center;justify-content:center;cursor:pointer}
.big{width:88px;height:88px;border-radius:44px;border:0;background:#D4F25A;color:#121210;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: #0B0B0A; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="width: 100%; display: flex; align-items: center; gap: 12px">
<a class="pz" href="UF09-9-Pause.dc.html" aria-label="Pause workout"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></a>
<div style="flex-grow: 1; display: flex; gap: 4px"><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #F2EFE8"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div><div style="flex-grow: 2; height: 4px; border-radius: 2px; background: #2A2925"></div></div>
<span class="m" style="font-size: 13px; width: 44px; text-align: right">Warm</span>
</div>
<div class="tag" style="margin-top: 8px">Warm-up · move {{idx}} of 3</div>
<div class="d" style="font-size: 44px; font-weight: 800; text-transform: uppercase; line-height: 1; text-align: center">{{name}}</div>
<svg width="160" height="150" viewBox="0 0 160 150" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<line x1="20" y1="140" x2="140" y2="140" stroke="#2A2925" stroke-width="3"></line>
<circle cx="{{fig.hx}}" cy="{{fig.hy}}" r="11" stroke="#F2EFE8" stroke-width="6"></circle>
<path d="{{fig.body}}" stroke="#F2EFE8" stroke-width="8"></path>
<path d="{{fig.legs}}" stroke="#D4F25A" stroke-width="8"></path>
</svg>
<div style="position: relative; width: 220px; height: 220px">
<svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
<circle cx="110" cy="110" r="96" fill="none" stroke="#1D1C19" stroke-width="12"></circle>
<circle cx="110" cy="110" r="96" fill="none" stroke="{{ringColor}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="{{offset}}" transform="rotate(-90 110 110)"></circle>
</svg>
<div class="d" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 84px; font-weight: 800" aria-live="polite">{{clock}}</div>
</div>
<div class="m" style="font-size: 16px; text-align: center; min-height: 22px">{{cue}}</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 24px">
<button class="rb" onClick="{{back}}" aria-label="Restart move"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg></button>
<button class="big" onClick="{{toggle}}" aria-label="{{toggleLabel}}">
<sc-if value="{{running}}" hint-placeholder-val="{{ true }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg></sc-if>
</button>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}"><button class="rb" onClick="{{next}}" aria-label="Next move"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l8 7-8 7M17 5v14"></path></svg></button></sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}"><a class="rb" href="UF09-3-Set.dc.html" aria-label="Finish warm-up"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l8 7-8 7M17 5v14"></path></svg></a></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { i: 0, left: 40, run: true }; }
componentDidMount() {
this.t = setInterval(() => {
if (!this.state.run) return;
if (this.state.left > 1) this.setState({ left: this.state.left - 1 });
else if (this.state.i < 2) this.setState({ i: this.state.i + 1, left: 40 });
else this.setState({ left: 0, run: false });
}, 1000);
}
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
const moves = [
{ name: 'Bodyweight Squats', cue: 'Slow and deep. Arms forward.', fig: { hx: 72, hy: 42, body: 'M72 55 L60 92', legs: 'M60 92 L100 96 L90 136' } },
{ name: 'Leg Swings', cue: 'Hold something. 20 s each leg.', fig: { hx: 80, hy: 26, body: 'M80 38 L80 88', legs: 'M80 88 L80 136 M80 88 L118 116' } },
{ name: 'Hip Openers', cue: 'Big circles with the knee, both ways.', fig: { hx: 80, hy: 26, body: 'M80 38 L80 88', legs: 'M80 88 L80 136 M80 88 L112 84 L110 110' } }
];
const { i, left, run } = this.state;
const mv = moves[i];
return {
idx: String(i + 1), name: mv.name, cue: left === 0 ? 'Warm-up done. Next: Back Squat.' : mv.cue, fig: mv.fig,
clock: '0:' + String(left).padStart(2, '0'),
offset: String(603 * (1 - left / 40)),
ringColor: left <= 5 ? '#FF8A3D' : '#D4F25A',
running: run, paused: !run, toggleLabel: run ? 'Pause timer' : 'Resume timer',
toggle: () => this.setState({ run: !run }),
back: () => this.setState({ left: 40, run: true }),
next: () => this.setState({ i: Math.min(2, i + 1), left: 40, run: true }),
notLast: i < 2, isLast: i === 2
};
}
}
</script>
</body>
</html>
