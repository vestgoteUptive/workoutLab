<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-08.3 Swap exercise before starting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A8A398}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:#D4F25A;color:#121210;font:700 17px 'DM Sans',sans-serif;text-decoration:none;flex-grow:1}
.btn:hover{color:#121210;background:#E6FA95}
.ghost{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 18px;border-radius:14px;border:1px solid #3A3833;color:#F2EFE8;font:500 16px 'DM Sans',sans-serif;text-decoration:none}
.rs{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid #3A3833;background:transparent;color:#F2EFE8;font:500 13px 'DM Sans',sans-serif;cursor:pointer}
.rs.on{background:#F2EFE8;color:#121210;border-color:#F2EFE8;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px solid #2E2C28;background:#1D1C19;color:#F2EFE8;text-align:left;font-family:'DM Sans',sans-serif;cursor:pointer}
.opt.on{border:2px solid #D4F25A;padding:11px}
.rad{width:22px;height:22px;border-radius:11px;border:2px solid #3A3833;flex-shrink:0;box-sizing:border-box}
.rad.on{border:7px solid #D4F25A}
.bd{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0B0A; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif; position: relative">
<div style="padding: 60px 20px; opacity: .3; display: flex; flex-direction: column; gap: 8px">
<div class="d" style="font-size: 30px; font-weight: 800; text-transform: uppercase">Lower A · 45 min</div>
<div style="height: 60px; border-radius: 14px; background: #1D1C19"></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 730px; box-sizing: border-box; padding: 12px 20px 28px; border-radius: 24px 24px 0 0; background: #171613; border-top: 1px solid #2E2C28; display: flex; flex-direction: column; gap: 14px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #3A3833; align-self: center"></div>
<div>
<div class="tag">Swap exercise 2</div>
<h2 class="d" style="margin: 2px 0 0; font-size: 32px; font-weight: 800; text-transform: uppercase; line-height: 1">Romanian Deadlift</h2>
<div class="m" style="font-size: 14px; margin-top: 4px">Hamstrings, glutes · 9 min slot</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="tag">Why swap? Helps us pick better</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{reasons}}" as="r" hint-placeholder-count="4"><button class="{{r.cls}}" onClick="{{r.pick}}">{{r.t}}</button></sc-for></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button class="{{o.cls}}" onClick="{{o.pick}}">
<span class="{{o.rad}}"></span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-weight: 700; font-size: 15px">{{o.t}}</span><sc-if value="{{o.best}}" hint-placeholder-val="{{ false }}"><span class="bd" style="background: #D4F25A; color: #121210">Best match</span></sc-if></span>
<span class="m" style="display: block; font-size: 13px">{{o.s}}</span>
<span style="display: flex; gap: 10px; font-size: 12px; margin-top: 4px"><span style="color: #E6FA95">{{o.match}}</span><span class="m">{{o.time}}</span><span class="m">{{o.eq}}</span></span>
</span>
</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #D4F25A">Always use this in Lower A</label>
<div style="margin-top: auto; display: flex; gap: 10px">
<a class="ghost" href="UF08-2-Suggest.dc.html">Keep</a>
<a class="btn" href="UF08-2-Suggest.dc.html">Use {{pickedName}}</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { r: 'busy', pick: 'dbrdl' }; }
renderVals() {
const byReason = {
busy: [
{ id: 'dbrdl', t: 'Dumbbell RDL', s: 'Same movement, grab dumbbells anywhere', match: 'Same muscles', time: '9 min', eq: 'Dumbbells', best: true },
{ id: 'cable', t: 'Cable Pull-Through', s: 'Hip hinge on the cable stack', match: 'Same muscles', time: '8 min', eq: 'Cable' },
{ id: 'curl', t: 'Extra Leg Curl sets', s: 'Machine already in your plan', match: 'Hamstrings only', time: '6 min', eq: 'Machine' }
],
feel: [
{ id: 'thrust', t: 'Hip Thrust', s: 'No lower-back load, more glutes', match: 'Glutes ↑ Hamstrings ↓', time: '9 min', eq: 'Barbell, bench', best: true },
{ id: 'curl', t: 'Extra Leg Curl sets', s: 'No spinal load at all', match: 'Hamstrings only', time: '6 min', eq: 'Machine' },
{ id: 'dbrdl', t: 'Dumbbell RDL', s: 'Lighter, easier to control', match: 'Same muscles', time: '9 min', eq: 'Dumbbells' }
],
variety: [
{ id: 'gm', t: 'Good Morning', s: 'Bar on back, hinge forward', match: 'Same muscles', time: '9 min', eq: 'Barbell', best: true },
{ id: 'sl', t: 'Single-Leg RDL', s: 'One side at a time, adds balance', match: 'Same muscles', time: '11 min', eq: 'Dumbbell' },
{ id: 'thrust', t: 'Hip Thrust', s: 'Glute-focused hinge', match: 'Glutes ↑ Hamstrings ↓', time: '9 min', eq: 'Barbell, bench' }
],
short: [
{ id: 'curl', t: 'Extra Leg Curl sets', s: 'Fast to set up', match: 'Hamstrings only', time: '6 min', eq: 'Machine', best: true },
{ id: 'dbrdl2', t: 'Dumbbell RDL · 2 sets', s: 'Same move, one set fewer', match: 'Same muscles', time: '6 min', eq: 'Dumbbells' },
{ id: 'skip', t: 'Skip it today', s: 'Frees 9 minutes', match: 'Hamstrings to catch up later', time: '0 min', eq: '' }
]
};
const reasons = [{ id: 'busy', t: 'Equipment taken' }, { id: 'feel', t: 'Back or joint discomfort' }, { id: 'variety', t: 'Want variety' }, { id: 'short', t: 'Short on time' }];
const list = byReason[this.state.r];
const picked = list.find((o) => o.id === this.state.pick) || list[0];
return {
reasons: reasons.map((r) => ({ ...r, cls: this.state.r === r.id ? 'rs on' : 'rs', pick: () => this.setState({ r: r.id, pick: byReason[r.id][0].id }) })),
opts: list.map((o) => { const on = picked.id === o.id; return { ...o, best: !!o.best, cls: on ? 'opt on' : 'opt', rad: on ? 'rad on' : 'rad', pick: () => this.setState({ pick: o.id }) }; }),
pickedName: picked.id === 'skip' ? 'skip' : picked.t.split(' · ')[0]
};
}
}
</script>
</body>
</html>
