<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-03.1 Active workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.tag{font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A8A398}
.card{background:#1D1C19;border:1px solid #2E2C28;border-radius:16px}
.ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#F2EFE8;text-decoration:none}
.ic:hover{background:#2A2925;color:#F2EFE8}
.set{display:grid;grid-template-columns:34px 1fr 64px 52px 44px;gap:8px;align-items:center;min-height:48px;padding:0 6px;border-radius:10px}
.set.done{background:#262A17}
.in{width:100%;box-sizing:border-box;height:40px;border-radius:9px;border:1px solid #3A3833;background:#121210;color:#F2EFE8;text-align:center;font:700 16px 'DM Sans',sans-serif}
.chk{width:44px;height:40px;border-radius:9px;border:1px solid #3A3833;background:transparent;color:#A8A398;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chk.on{background:#D4F25A;border-color:#D4F25A;color:#121210}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #121210; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="padding: 52px 16px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2E2C28">
<a class="ic" href="UF02-2-Preview.dc.html" aria-label="Minimise workout"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></a>
<div style="text-align: center"><div class="tag">Lower A</div><div class="d" style="font-size: 26px; font-weight: 800">12:48</div></div>
<a href="UF03-3-Summary.dc.html" style="min-height: 40px; padding: 0 16px; border-radius: 10px; background: #D4F25A; color: #121210; font-weight: 700; font-size: 15px; display: flex; align-items: center; text-decoration: none">Finish</a>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<div class="card" style="padding: 14px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 4px; padding: 0 4px">
<div style="flex-grow: 1"><div class="d" style="font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1">Back Squat</div><div class="m" style="font-size: 13px; margin-top: 2px">Barbell · target 4 × 6–8 · RPE 8</div></div>
<a class="ic" href="UF04-2-Detail.dc.html" aria-label="How to do Back Squat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></svg></a>
<a class="ic" href="UF05-1-Swap.dc.html" aria-label="Swap exercise"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"></path></svg></a>
</div>
<div style="padding: 8px 10px; margin: 0 4px; border-radius: 10px; background: #2A2925; font-size: 13px; display: flex; gap: 8px"><span style="color: #D4F25A; font-weight: 700">Cue</span><span>Brace, then sit between your hips. Knees track over toes.</span></div>
<div class="set" style="min-height: 28px"><span class="tag">Set</span><span class="tag">Previous</span><span class="tag" style="text-align: center">kg</span><span class="tag" style="text-align: center">Reps</span><span></span></div>
<sc-for list="{{sets}}" as="s" hint-placeholder-count="5">
<div class="{{s.rowCls}}">
<span style="font-weight: 700; color: {{s.labelColor}}; text-align: center">{{s.label}}</span>
<span class="m" style="font-size: 14px">{{s.prev}}</span>
<input class="in" value="{{s.kg}}" aria-label="{{s.kgLabel}}">
<input class="in" value="{{s.reps}}" aria-label="{{s.repsLabel}}">
<button class="{{s.chkCls}}" onClick="{{s.toggle}}" aria-label="{{s.chkLabel}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></button>
</div>
</sc-for>
<button style="min-height: 44px; margin: 0 4px; border-radius: 10px; border: 1px dashed #3A3833; background: transparent; color: #F2EFE8; font: 500 15px 'DM Sans', sans-serif">+ Add set</button>
</div>
<div class="card" style="padding: 14px; display: flex; align-items: center; justify-content: space-between">
<div><div style="font-weight: 700">Romanian Deadlift</div><div class="m" style="font-size: 13px">0 / 3 sets · last 80 kg × 10</div></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8A398" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
</div>
<div class="card" style="padding: 14px; display: flex; align-items: center; justify-content: space-between">
<div><div style="font-weight: 700">Dumbbell Sumo Squat</div><div class="m" style="font-size: 13px">0 / 3 sets · last 32 kg × 12</div></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8A398" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</div>
<a href="UF03-2-Rest.dc.html" style="margin: 0 16px 28px; min-height: 56px; border-radius: 14px; background: #262A17; border: 1px solid #4A5520; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-decoration: none; color: #F2EFE8">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4F25A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M10 2h4"></path></svg>
<span style="flex-grow: 1; font-weight: 700">Rest · 1:32 left</span>
<span class="m" style="font-size: 13px">Tap to expand</span>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { done: [true, true, true, false, false] }; }
renderVals() {
const rows = [
{ label: 'W', prev: '40 × 10', kg: '40', reps: '10', warm: true },
{ label: '1', prev: '97.5 × 8', kg: '100', reps: '8' },
{ label: '2', prev: '97.5 × 8', kg: '100', reps: '8' },
{ label: '3', prev: '97.5 × 7', kg: '100', reps: '' },
{ label: '4', prev: '97.5 × 6', kg: '100', reps: '' }
];
return {
sets: rows.map((r, i) => {
const on = this.state.done[i];
return { ...r, rowCls: on ? 'set done' : 'set', chkCls: on ? 'chk on' : 'chk', labelColor: r.warm ? '#FF8A3D' : '#F2EFE8', kgLabel: 'Set ' + r.label + ' weight in kg', repsLabel: 'Set ' + r.label + ' reps', chkLabel: on ? 'Mark set ' + r.label + ' not done' : 'Mark set ' + r.label + ' done', toggle: () => { const d = this.state.done.slice(); d[i] = !d[i]; this.setState({ done: d }); } };
})
};
}
}
</script>
</body>
</html>
