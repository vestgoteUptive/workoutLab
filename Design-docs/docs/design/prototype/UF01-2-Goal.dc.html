<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UF-01.2 Goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#121210}
a{color:#D4F25A}a:hover{color:#E6FA95}
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif}
.m{color:#A8A398}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#D4F25A;color:#121210;font:700 16px 'DM Sans',sans-serif;text-decoration:none}
.btn:hover{color:#121210;background:#E6FA95}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:16px 18px;border-radius:16px;border:1px solid #2E2C28;background:#1D1C19;color:#F2EFE8;font-family:'DM Sans',sans-serif;text-align:left;cursor:pointer}
.opt.on{border:2px solid #D4F25A;padding:15px 17px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 22px; background: #121210; color: #F2EFE8; font-family: 'DM Sans', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px">
<a href="UF01-1-Welcome.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #F2EFE8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; gap: 6px"><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D4F25A"></div><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2E2C28"></div><div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2E2C28"></div></div>
<span class="m" style="font-size: 13px">1/3</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="d" style="margin: 0; font-size: 40px; line-height: 1; font-weight: 800; text-transform: uppercase">What's your main goal?</h1>
<p class="m" style="margin: 0; font-size: 15px">Sets your rep ranges and weekly volume. Change it any time.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
<button class="{{g.cls}}" onClick="{{g.pick}}"><span style="font-size: 17px; font-weight: 700">{{g.t}}</span><span class="m" style="font-size: 14px">{{g.s}}</span></button>
</sc-for>
</div>
<div style="margin-top: auto"><a class="btn" href="UF01-3-Experience.dc.html">Continue</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { picked: 'muscle' }; }
renderVals() {
const list = [
{ id: 'muscle', t: 'Build muscle', s: 'Hypertrophy · 6–12 reps · more sets' },
{ id: 'strength', t: 'Get stronger', s: 'Strength · 3–6 reps · longer rest' },
{ id: 'fat', t: 'Lose fat', s: 'Keep muscle · circuits and steps goal' },
{ id: 'general', t: 'General fitness', s: 'Balanced full-body training' }
];
return { goals: list.map((g) => ({ ...g, cls: this.state.picked === g.id ? 'opt on' : 'opt', pick: () => this.setState({ picked: g.id }) })) };
}
}
</script>
</body>
</html>
