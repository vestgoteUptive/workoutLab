<!doctype html>
<!--
  Body figure v2 preview (T-0660, D-0225; replaces the T-0314/T-0614 previews and the T-0650
  variants). Open it with `node Design-docs/docs/design/assets/body-figure/serve-preview.mjs`: that
  builds the token CSS if needed, serves the repo root and prints the URL. (The page fetches
  body-figure.svg and the token CSS, so file:// won't work.)
  The figure rules are not copied here: the page links the component's own body-figure.css, so
  what you see is what ships. Visual target: redesign-cobalt/canvas/Body Figure Export.dc.html.
  Colours come only from var(--wl-...) tokens; check-figure.mjs checks that.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Body figure v2 preview</title>
    <link rel="stylesheet" href="../../../../../packages/design-tokens/dist/tokens.css" />
    <link rel="stylesheet" href="../../../../../packages/design-tokens/src/fonts-state.css" />
    <link
      rel="stylesheet"
      href="../../../../../apps/web/src/components/body-figure/body-figure.css"
    />
    <style id="wl-state-vars">
      /* The slice of the D-0211 state mapping (apps/web/src/main.css) the figure reads. */
      [data-wl-state="plan"] {
        --wl-bg: var(--wl-color-plan-bg);
        --wl-ink: var(--wl-color-plan-ink);
      }
      [data-wl-state="lift"] {
        --wl-bg: var(--wl-color-lift-bg);
        --wl-ink: var(--wl-color-lift-ink);
      }
      [data-wl-state="rest"] {
        --wl-bg: var(--wl-color-rest-bg);
        --wl-ink: var(--wl-color-rest-ink);
      }
      :root {
        --wl-bg: var(--wl-color-bg);
        --wl-ink: var(--wl-color-text);
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background: var(--wl-color-surface);
        color: var(--wl-color-text);
        font-family: var(--wl-font, sans-serif);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        align-items: flex-start;
      }
      .demo {
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
        align-items: center;
        padding: 1.25rem 1.5rem 1.5rem;
        border-radius: 1.25rem;
        background: var(--wl-bg);
        color: var(--wl-ink);
      }
      .demo p {
        align-self: flex-start;
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Body figure v2 (smooth outline, 1b)</h1>
    <section data-preview="v2">
      <div class="row">
        <div
          class="demo"
          data-wl-state="plan"
          data-size="full"
          data-cov="chest:4 back:4 shoulders:4 arms:3 core:1 glutes:4 quads:4 hamstrings:2"
          data-attention="glutes core"
        >
          <p>Coverage · full · step 4 white, attention salmon + ring</p>
        </div>
        <div
          class="demo"
          data-wl-state="plan"
          data-size="detail"
          data-primary="chest quads"
          data-secondary="shoulders arms"
        >
          <p>Primary / secondary · detail</p>
        </div>
        <div class="demo" data-wl-state="plan" data-size="detail" data-ring="hamstrings">
          <p>Highlighted · hamstrings</p>
        </div>
        <div class="demo" data-wl-state="plan" data-size="detail" data-primary="chest back">
          <p>Priority areas · selected = white</p>
        </div>
        <div class="demo" data-wl-state="plan" data-size="detail">
          <p>Neutral · no data</p>
        </div>
        <div class="demo" data-wl-state="lift" data-size="detail" data-primary="chest">
          <p>Lift</p>
        </div>
        <div class="demo" data-wl-state="rest" data-size="detail" data-primary="chest">
          <p>Rest</p>
        </div>
        <div class="demo" data-wl-state="plan" data-size="compact" data-primary="quads">
          <p>Compact · 60 px</p>
        </div>
        <div class="demo" data-legacy data-size="detail" data-primary="chest" data-attention="core">
          <p>No state (Chalk and Iron screens)</p>
        </div>
      </div>
    </section>

    <script type="module">
      const svgText = await (await fetch("body-figure.svg")).text();
      const words = (s) => (s ?? "").split(/\s+/).filter(Boolean);
      let n = 0;
      for (const demo of document.querySelectorAll(".demo[data-size]")) {
        demo.insertAdjacentHTML("beforeend", svgText);
        const svg = demo.lastElementChild;
        const hatchId = `wl-fig-hatch-${(n += 1)}`;
        svg.querySelector("#wl-fig-hatch").id = hatchId;
        svg.style.setProperty("--wl-fig-hatch", `url(#${hatchId})`);
        const ring = new Set(words(demo.dataset.ring));
        svg.setAttribute(
          "class",
          `wl-fig wl-fig--${demo.dataset.size}${ring.size ? " wl-fig--has-highlight" : ""}`,
        );
        svg.setAttribute("aria-hidden", "true");
        const attention = new Set(words(demo.dataset.attention));
        const style = {};
        for (const pair of words(demo.dataset.cov)) {
          const [area, step] = pair.split(":");
          style[area] = `step-${step}`;
        }
        for (const a of words(demo.dataset.primary)) style[a] = "primary";
        for (const a of words(demo.dataset.secondary)) style[a] = "secondary";
        for (const view of svg.querySelectorAll("[data-view]")) {
          const regions = [...view.querySelectorAll("[data-area]")];
          for (const r of regions) {
            const a = r.dataset.area;
            r.classList.add(`wl-fig__region--${style[a] ?? "none"}`);
            if (attention.has(a)) r.classList.add("wl-fig__region--attention");
            if (ring.has(a)) r.classList.add("wl-fig__region--highlighted");
          }
          const halo = (r, cls) => {
            const p = r.cloneNode();
            p.removeAttribute("data-area");
            p.setAttribute("class", cls);
            return p;
          };
          // Same paint order as BodyFigure.tsx: body, ring, regions, then halo + attention region.
          const firstRegion = regions[0];
          for (const r of regions.filter((x) => ring.has(x.dataset.area)))
            for (const cls of ["wl-fig__ring", "wl-fig__ring-gap"])
              view.insertBefore(halo(r, cls), firstRegion);
          for (const r of regions.filter((x) => attention.has(x.dataset.area))) {
            view.append(halo(r, "wl-fig__halo-warn"), halo(r, "wl-fig__halo-gap"), r);
          }
        }
        if (demo.hasAttribute("data-legacy")) demo.removeAttribute("data-wl-state");
      }
      document.documentElement.dataset.ready = "true";
    </script>
  </body>
</html>
